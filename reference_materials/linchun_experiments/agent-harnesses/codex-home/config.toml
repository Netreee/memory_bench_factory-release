# Codex 专用配置（与用户 ~/.codex 隔离）。
# 上游：aiaiapi。wire_api 先走 responses。

model = "gpt-5.6-luna"
model_provider = "aiaiapi"

[model_providers.aiaiapi]
name = "aiaiapi"
base_url = "https://api.aiaiapi.com/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"
requires_openai_auth = false

[model_providers.aliyun]
name = "aliyun maas"
base_url = "https://ws-g56fq4ve8j535aoe.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"
requires_openai_auth = false
