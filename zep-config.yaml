store:
  type: postgres
  postgres:
    dsn: postgres://zep:zep_eval_2026@postgres:5432/zep?sslmode=disable

llm:
  service: openai
  model: DeepSeek-V4-Flash
  openai_endpoint: "http://embed_server:9800/v1"
  openai_api_key: ""

nlp:
  server_url: ""

extractors:
  messages:
    summarizer:
      enabled: true
      embeddings:
        enabled: true
        dimensions: 512
        service: openai
        chunk_size: 512
      entities:
        enabled: false
    embeddings:
      enabled: true
      dimensions: 512
      service: openai
      chunk_size: 512
    entities:
      enabled: false
    intent:
      enabled: false
  documents:
    embeddings:
      enabled: true
      dimensions: 512
      service: openai
      chunk_size: 512

memory:
  message_window: 2

server:
  host: 0.0.0.0
  port: 8000
  web_enabled: true
  max_request_size: 5242880

auth:
  secret: eval-dev-secret-not-for-prod
  required: false

log:
  level: info

opentelemetry:
  enabled: false

data_config:
  purge_every: 60

development: true

custom_prompts:
  summarizer_prompts:
    openai: ""
    anthropic: ""
