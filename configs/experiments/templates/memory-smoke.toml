schema_version = 2
experiment_id = "memory-office-smoke-proposal"
track = "memory"
output_root = "output/eval"

[answering_model]
label = "deepseek-v4-flash"
model_id = "deepseek-v4-flash"
endpoint_profile = "DEEPSEEK"

# benchmark 数据不在本仓库内；这里指向工作区里保留的历史候选快照（UNMET，仅供 smoke）。
# 正式实验请改成 factory 的生成产物 output/runs/<run_id>/，或任意相对/绝对路径。
[[benchmarks]]
path = "../agent-harnesses/input/office__20260902-121616"
corpus_variant = "full"
allow_unmet = true

[[targets]]
id = "simplemem"
system = "memory.simplemem"

[[targets]]
id = "iterative"
system = "memory.iterative"

[[targets]]
id = "fullcontext"
system = "memory.fullcontext"

[[targets]]
id = "mem0-oss"
system = "memory.mem0-oss"

[targets.memory_config]
top_k = 3
namespace_prefix = "mem0_eval"

[targets.memory_config.internal_model]
model_id = "deepseek-v4-flash"
endpoint_profile = "DEEPSEEK"

[targets.memory_config.embedder]
provider = "huggingface"
model_id = "BAAI/bge-small-zh-v1.5"

[targets.memory_config.vector_store]
provider = "qdrant"
host = "127.0.0.1"
port = 6333
service_version = "1.19.1"

[[targets]]
id = "graphiti-oss"
system = "memory.graphiti-oss"

[[targets]]
id = "memos"
system = "memory.memos"

[protocol]
version = "TBD"
answering_model_policy = "fixed"
filler_policy = "include"
context_token_budget = "TBD"

[execution]
mode = "smoke"
limit = 6
seed = 0
